fragment SettingsFields on Setting {
  id
  baseUrl
  model
  systemPrompt
  maxTokens
  temperature
  maxToolIterations
  toolDiscovery
  toolSelectModel
  requestTimeoutSeconds
  maxRetries
  maxConcurrentRuns
  runRetentionDays
}

query Settings {
  settings {
    ...SettingsFields
  }
}

# `agentId` asks that profile's endpoint instead of the server's, so the model list on a
# profile's form is the list of models it can actually run.
query Models($agentId: String) {
  models(agentId: $agentId)
}

# Reads the row back so the page can reseed from what was written, rather than wait for a refetch
# and spend the gap comparing the form against the row as it was before the save.
mutation UpdateSettings($set: UpdateSettingInput!) {
  updateSettingSingle(where: { id: { eq: "default" } }, set: $set) {
    ...SettingsFields
  }
}

mutation SetApiKey($apiKey: String!) {
  setApiKey(apiKey: $apiKey)
}
