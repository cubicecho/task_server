query Settings {
  settings {
    id
    baseUrl
    model
    systemPrompt
    maxTokens
    temperature
    maxToolIterations
    toolDiscovery
    toolSelectModel
    requestTimeoutSeconds
    maxRetries
    maxConcurrentRuns
    runRetentionDays
  }
}

query Models {
  models
}

mutation UpdateSettings($set: UpdateSettingInput!) {
  updateSettingSingle(where: { id: { eq: "default" } }, set: $set) {
    id
  }
}

mutation SetApiKey($apiKey: String!) {
  setApiKey(apiKey: $apiKey)
}
