# One question — is anything wrong — asked in one round trip.
#
# Per task, the last run that actually ran, the last one refused for a collision, and whether a
# firing is sitting in the queue. They are three selections of the same relation under three
# aliases because they are three different questions about the same rows, and each alias's
# arguments resolve on their own. `skipped` and `queued` are both excluded from `last` for the
# same reason those rows exist at all: they record a firing, not the task doing anything, so a
# busy hour would otherwise hide the run before it.
query Status {
  tasks(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    enabled
    triggers {
      id
      kind
      enabled
    }
    last: runs(
      limit: 1
      where: { status: { notInArray: [skipped, queued] } }
      orderBy: { startedAt: { direction: desc, priority: 1 } }
    ) {
      id
      status
      error
      startedAt
      finishedAt
    }
    # A firing that found the server full and is waiting for a slot. It has not failed and
    # nothing is lost, but the task is behind its schedule, which the last run cannot say.
    waiting: runs(
      limit: 1
      where: { status: { eq: queued } }
      orderBy: { startedAt: { direction: asc, priority: 1 } }
    ) {
      id
      error
      attempts
      startedAt
    }
    # One row per collision rather than per firing, so `attempts` is how many deliveries it
    # stands for and `finishedAt` moves with the most recent of them.
    collision: runs(
      limit: 1
      where: { status: { eq: skipped } }
      orderBy: { startedAt: { direction: desc, priority: 1 } }
    ) {
      id
      error
      attempts
      startedAt
      finishedAt
    }
  }

  # Failures the tiles above will not account for, because the task has run since and now looks
  # well. A run that broke is worth seeing once even after something has papered over it.
  failures: runs(
    limit: 10
    where: { status: { eq: error } }
    orderBy: { startedAt: { direction: desc, priority: 1 } }
  ) {
    id
    error
    startedAt
    task {
      id
      name
    }
  }

  # A server that is enabled and did not connect is every run since going out with fewer tools
  # than the task was written for, and nothing else says so without opening the servers page.
  mcpStatus {
    id
    slug
    label
    status
    error
  }
}
