fragment TaskFields on Task {
  id
  name
  prompt
  agentId
  model
  systemPrompt
  enabled
  updatedAt
  triggers(orderBy: { createdAt: { direction: asc, priority: 1 } }) {
    id
    kind
    cron
    timezone
    event
    enabled
  }
  # The last run that is a run: a refusal and a firing still waiting for a slot both have a
  # `startedAt` and neither is the task doing anything, so either would hide the run before it.
  runs(
    limit: 1
    where: { status: { notInArray: [skipped, queued] } }
    orderBy: { startedAt: { direction: desc, priority: 1 } }
  ) {
    id
    status
    startedAt
    finishedAt
  }
}

fragment StepFields on Step {
  id
  parentId
  branch
  position
  kind
  name
  prompt
  cases
  model
  systemPrompt
  context
  enabled
}

# The list page never asks for this: a flow per task is a lot of payload for a page that shows
# names. The edit page asks for one task and gets all of it.
fragment TaskDetailFields on Task {
  ...TaskFields
  steps(orderBy: { position: { direction: asc, priority: 1 } }) {
    ...StepFields
  }
}

query Tasks {
  tasks(orderBy: { name: { direction: asc, priority: 1 } }) {
    ...TaskFields
  }
  schedule {
    triggerId
    nextRun
  }
}

query Task($id: String!) {
  task(where: { id: { eq: $id } }) {
    ...TaskDetailFields
  }
}

mutation CreateTask($values: CreateTaskInput!) {
  createTask(values: $values) {
    ...TaskFields
  }
}

mutation UpdateTask($id: String!, $set: UpdateTaskInput!) {
  updateTaskSingle(where: { id: { eq: $id } }, set: $set) {
    ...TaskFields
  }
}

mutation DeleteTask($id: String!) {
  deleteTaskSingle(where: { id: { eq: $id } }) {
    id
  }
}

mutation SetTaskSteps($taskId: String!, $steps: [StepInput!]!) {
  setTaskSteps(taskId: $taskId, steps: $steps) {
    ...StepFields
  }
}

mutation CreateTrigger($values: CreateTriggerInput!) {
  createTrigger(values: $values) {
    id
  }
}

mutation UpdateTrigger($id: String!, $set: UpdateTriggerInput!) {
  updateTriggerSingle(where: { id: { eq: $id } }, set: $set) {
    id
  }
}

mutation DeleteTrigger($id: String!) {
  deleteTriggerSingle(where: { id: { eq: $id } }) {
    id
  }
}

mutation StopTask($taskId: String!) {
  stopTask(taskId: $taskId)
}

# `payload` is a webhook body handed over by hand — a replay of one that failed, or a made-up
# one to try an `{{event}}` prompt. Left out, the run has none, which is every other run.
mutation RunTask($taskId: String!, $payload: JSON) {
  runTask(taskId: $taskId, payload: $payload) {
    id
    status
    error
  }
}

# What to put in the body box before anyone types in it: the last body this task actually saw.
# Read when the box opens rather than with the task list — one payload is wanted at a time, and
# the list is polled.
query LastPayload($taskId: String!) {
  runs(
    limit: 1
    where: { taskId: { eq: $taskId }, payload: { isNotNull: true } }
    orderBy: { startedAt: { direction: desc, priority: 1 } }
  ) {
    id
    payload
  }
}
