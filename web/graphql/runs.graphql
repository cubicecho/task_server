# The list, and only what a collapsed card draws. This is polled every five seconds for a
# hundred rows, and a run's steps, tool calls and webhook payload are read once — when someone
# opens it. `RunDetail` below fetches those, for the one run that is open.
query Runs($taskId: String) {
  runs(
    limit: 100
    where: { taskId: { eq: $taskId } }
    orderBy: { startedAt: { direction: desc, priority: 1 } }
  ) {
    id
    taskId
    status
    startedAt
    finishedAt
    # Drawn in the card as a two-line summary, so the poll pays for these.
    output
    error
    totalTokens
    attempts
    task {
      name
    }
    # Why this run happened. Null covers both a hand-started run and one whose trigger has since
    # been deleted, so the UI says nothing rather than guessing which.
    trigger {
      id
      kind
      cron
      event
    }
  }
}

# One opened run, in full. There is no singular root field for a run, so this is the list of one.
query RunDetail($id: String!) {
  runs(limit: 1, where: { id: { eq: $id } }) {
    id
    toolCalls
    payload
    steps(orderBy: { position: { direction: asc, priority: 1 } }) {
      id
      position
      depth
      name
      kind
      status
      branch
      output
      error
      toolCalls
      totalTokens
    }
  }
}

mutation DeleteRun($id: String!) {
  deleteRunSingle(where: { id: { eq: $id } }) {
    id
  }
}

subscription RunEvents($runId: String!) {
  runEvents(runId: $runId) {
    seq
    kind
    text
    name
    step
    ok
  }
}
