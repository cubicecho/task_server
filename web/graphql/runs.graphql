# The list, and only what a collapsed card draws. This is polled every five seconds while it is
# showing the newest page unfiltered, and a run's steps, tool calls and webhook payload are read
# once — when someone opens it. `RunDetail` below fetches those, for the one run that is open.
#
# The filter is built by the page rather than named a field at a time here, because the search box
# is an OR across three columns and every other control ANDs with it. `limit` grows a page at a
# time instead of an `offset`: rows arrive while you read, and paging by offset over a list that
# is being prepended to shows the same run twice and skips another.
query Runs($where: RunFilters, $limit: Int!) {
  runs(limit: $limit, where: $where, orderBy: { startedAt: { direction: desc, priority: 1 } }) {
    id
    taskId
    status
    startedAt
    finishedAt
    # Drawn in the card as a two-line summary, so the poll pays for these.
    output
    error
    totalTokens
    attempts
    # The card says how many things a run made, so one that wrote a doc can be spotted without
    # opening each. A count, not the rows: those are `RunDetail`'s.
    artifactsAggregate {
      count
    }
    task {
      name
    }
    # Why this run happened. Null covers both a hand-started run and one whose trigger has since
    # been deleted, so the UI says nothing rather than guessing which.
    trigger {
      id
      kind
      cron
      event
    }
  }
}

# One opened run, in full. There is no singular root field for a run, so this is the list of one.
query RunDetail($id: String!) {
  runs(limit: 1, where: { id: { eq: $id } }) {
    id
    toolCalls
    payload
    hooks
    metrics
    steps(orderBy: { position: { direction: asc, priority: 1 } }) {
      id
      position
      depth
      name
      kind
      status
      branch
      output
      error
      toolCalls
      totalTokens
      hooks
      resources
    }
    # What the run made, in the order it first linked to each. A step's links are written in one
    # insert and share a `createdAt`, so the uri breaks the tie rather than leaving it to the plan.
    # The driver sorts the highest `priority` first, so the tie-break is the lower number.
    artifacts(
      orderBy: { createdAt: { direction: asc, priority: 2 }, uri: { direction: asc, priority: 1 } }
    ) {
      id
      runStepId
      serverId
      serverSlug
      uri
      name
      title
      mimeType
      lastModified
      webUrl
      count
    }
  }
}

# One artifact read back from its server for a preview — fresh each time, so a document edited
# since the run reads as it is now.
query McpResource($serverId: String!, $uri: String!) {
  mcpResource(serverId: $serverId, uri: $uri) {
    uri
    mimeType
    text
    truncated
  }
}

mutation DeleteRun($id: String!) {
  deleteRun(where: { id: { eq: $id } }) {
    id
  }
}

subscription RunEvents($runId: String!) {
  runEvents(runId: $runId) {
    seq
    kind
    text
    name
    step
    ok
  }
}

# Names for the task filter, and nothing else. The `Tasks` query on the tasks page carries every
# prompt, every trigger and a last run apiece, which is a lot of wire for a dropdown.
query RunFilterTasks {
  tasks(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
  }
}
