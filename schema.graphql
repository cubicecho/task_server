"""One execution of a task, with what it produced and what it cost."""
type Run {
  id: String!

  """The task that was run."""
  taskId: String!

  """The trigger that started it. Null for a run started by hand."""
  triggerId: String

  """
  `stopped` is a run called off by hand — not a failure, and not a result. `skipped` is a trigger that fired at a task already running: nothing executed, and the reason is in `error`.
  """
  status: RunsStatusEnum!
  startedAt: DateTime!
  finishedAt: DateTime

  """
  What the trigger handed the run: a webhook's parsed body, and null for everything else. It is what `{{event}}` interpolated into the prompt.
  """
  payload: JSON

  """`skipped` only: the run that was in the way."""
  blockedBy: String

  """
  How many firings this row accounts for. One for a run; more for a skip that the same trigger walked into repeatedly while the same run held the task.
  """
  attempts: Int!

  """The agent's final reply."""
  output: String!

  """Why it failed, or — on a `skipped` run — why it never started."""
  error: String!

  """Every tool the run called, in order, as JSON."""
  toolCalls: JSON
  promptTokens: Int!
  completionTokens: Int!
  totalTokens: Int!

  """
  Opaque cursor of this row's position in the query's ordering. Pass it as `after` to resume from here. Only set on rows returned by a list query.
  """
  cursor: String
  task(where: TaskFilters): Task!
  trigger(where: TriggerFilters): Trigger
  steps(
    where: RunStepFilters
    orderBy: RunStepOrderBy
    offset: Int
    limit: Int

    """
    Keyset pagination: only return related rows strictly after this cursor (a row's `cursor` field from a previous page of this relation, under the same orderBy).
    """
    after: String
    distinct: [RunStepDistinctColumn!]
  ): [RunStep!]!
  stepsAggregate(where: RunStepFilters): RunStepAggregate!
}

