"""
The one row of server-wide defaults. Every task falls back to what is here.
"""
type Setting {
  id: String!

  """
  Any OpenAI-compatible endpoint: Ollama `:11434/v1`, LM Studio `:1234/v1`, OpenAI, OpenRouter, vLLM.
  """
  baseUrl: String!

  """The model a task uses unless it names one of its own."""
  model: String!

  """
  What every run is told before its prompt, unless the task overrides it.
  """
  systemPrompt: String!

  """Ceiling on one reply."""
  maxTokens: Int!

  """Sampling temperature passed to the model."""
  temperature: Float!

  """
  Ceiling on tool round-trips in one run, so a stuck task cannot loop forever.
  """
  maxToolIterations: Int!

  """
  `eager` sends every MCP tool definition on every request. `ondemand` sends a name-only catalogue and lets the model load the schemas it needs — far cheaper with many tools, at the cost of a round trip on the runs that use them.
  """
  toolDiscovery: SettingsToolDiscoveryEnum!

  """
  Small model that guesses a run's tools before it starts, so on-demand loading usually costs no round trip. Empty uses the task's model. Unused unless discovery is on demand.
  """
  toolSelectModel: String!

  """
  How long a finished run is kept, in days. Older runs are deleted hourly. Zero keeps every run forever.
  """
  runRetentionDays: Int!

  """
  Seconds of *silence* from the endpoint before a request is given up on. The clock resets on every chunk, so a long answer is never cut off. Zero waits forever.
  """
  requestTimeoutSeconds: Int!

  """
  How many times a request that failed *before producing anything* is tried again. Only that case is safe to retry. Zero turns retries off.
  """
  maxRetries: Int!

  """
  How many runs may be in flight at once, across every task. A firing that arrives with no slot free leaves a `skipped` run saying so. Zero lifts the limit.
  """
  maxConcurrentRuns: Int!

  """
  Opaque cursor of this row's position in the query's ordering. Pass it as `after` to resume from here. Only set on rows returned by a list query.
  """
  cursor: String
}

enum SettingsToolDiscoveryEnum {
  """Value: eager"""
  eager

  """Value: ondemand"""
  ondemand
}

