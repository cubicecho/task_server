"""What starts a task: a cron expression, or a webhook id."""
type Trigger {
  id: String!

  """The task this starts."""
  taskId: String!

  """
  `cron` fires on a schedule. `event` fires when `POST /webhooks/<event>` arrives.
  """
  kind: TriggersKindEnum!

  """Cron expression, for `kind: "cron"`."""
  cron: String!

  """
  IANA zone the expression is read in. Empty means the server's own zone.
  """
  timezone: String!

  """
  The webhook id, for `kind: "event"`: `POST /webhooks/<this>` runs the task. It is the whole of the address — there is no secret — so pick something unguessable.
  """
  event: String!

  """A disabled trigger stays on the task and never fires."""
  enabled: Boolean!
  createdAt: DateTime!

  """
  Opaque cursor of this row's position in the query's ordering. Pass it as `after` to resume from here. Only set on rows returned by a list query.
  """
  cursor: String
  task(where: TaskFilters): Task!
  runs(
    where: RunFilters
    orderBy: RunOrderBy
    offset: Int
    limit: Int

    """
    Keyset pagination: only return related rows strictly after this cursor (a row's `cursor` field from a previous page of this relation, under the same orderBy).
    """
    after: String
    distinct: [RunDistinctColumn!]
  ): [Run!]!
  runsAggregate(where: RunFilters): RunAggregate!
}

