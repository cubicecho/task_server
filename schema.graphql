"""
A prompt to run, on a schedule or on a webhook. The unit everything else hangs off.
"""
type Task {
  id: String!

  """What this task is called, in the task list and the run history."""
  name: String!

  """What the agent is asked to do, each time this task fires."""
  prompt: String!

  """Empty falls back to the default model in settings."""
  model: String!

  """Empty falls back to the default system prompt in settings."""
  systemPrompt: String!

  """
  A disabled task is never started by a trigger, and can still be run by hand.
  """
  enabled: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!

  """
  Opaque cursor of this row's position in the query's ordering. Pass it as `after` to resume from here. Only set on rows returned by a list query.
  """
  cursor: String
  triggers(
    where: TriggerFilters
    orderBy: TriggerOrderBy
    offset: Int
    limit: Int

    """
    Keyset pagination: only return related rows strictly after this cursor (a row's `cursor` field from a previous page of this relation, under the same orderBy).
    """
    after: String
    distinct: [TriggerDistinctColumn!]
  ): [Trigger!]!
  triggersAggregate(where: TriggerFilters): TriggerAggregate!
  steps(
    where: StepFilters
    orderBy: StepOrderBy
    offset: Int
    limit: Int

    """
    Keyset pagination: only return related rows strictly after this cursor (a row's `cursor` field from a previous page of this relation, under the same orderBy).
    """
    after: String
    distinct: [StepDistinctColumn!]
  ): [Step!]!
  stepsAggregate(where: StepFilters): StepAggregate!
  runs(
    where: RunFilters
    orderBy: RunOrderBy
    offset: Int
    limit: Int

    """
    Keyset pagination: only return related rows strictly after this cursor (a row's `cursor` field from a previous page of this relation, under the same orderBy).
    """
    after: String
    distinct: [RunDistinctColumn!]
  ): [Run!]!
  runsAggregate(where: RunFilters): RunAggregate!
}

