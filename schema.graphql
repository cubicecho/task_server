"""
What runs after the task's own prompt. A tree rather than a list, because a `decision` step picks which of its arms runs next.
"""
type Step {
  id: String!

  """The task whose flow this step belongs to."""
  taskId: String!

  """
  The decision this step hangs off. Null means the task's own top-level sequence.
  """
  parentId: String

  """Which arm of the parent decision this sits in. Empty at the top level."""
  branch: String!

  """Where in its sequence this step runs, from 0."""
  position: Int!

  """
  `agent` does the work. `decision` does the work *and* picks the arm to run next.
  """
  kind: StepsKindEnum!

  """
  What this step is called, in the run history and in `{{steps.<name>}}`.
  """
  name: String!

  """
  What this step asks for. `{{steps.<name>}}` interpolates an earlier step's output.
  """
  prompt: String!

  """
  Decision only: the arms it may choose between. `default` is always available.
  """
  cases: JSON

  """Empty falls back to the task's model, then to settings."""
  model: String!

  """Empty falls back to the task's system prompt, then to settings."""
  systemPrompt: String!

  """How much of the run so far this step is shown before its own prompt."""
  context: StepsContextEnum!

  """A disabled step is passed over, and leaves a `skipped` row in the run."""
  enabled: Boolean!
  createdAt: DateTime!

  """
  Opaque cursor of this row's position in the query's ordering. Pass it as `after` to resume from here. Only set on rows returned by a list query.
  """
  cursor: String
  task(where: TaskFilters): Task!
}

enum StepsKindEnum {
  """Value: agent"""
  agent

  """Value: decision"""
  decision
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
