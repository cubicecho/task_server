  model: String
  systemPrompt: String
  enabled: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

"""
One entry of a batch update of Task: the rows `where` matches get this entry's `set` applied.
"""
input UpdateTaskManyInput {
  """Rows this entry updates. An omitted filter updates every row."""
  where: TaskFilters
  set: UpdateTaskInput!
}

input TaskFilters {
  id: StringFilter
  name: StringFilter
  prompt: StringFilter
  model: StringFilter
  systemPrompt: StringFilter
  enabled: BooleanFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  triggers: TriggerListRelationFilter
  steps: StepListRelationFilter
  runs: RunListRelationFilter

  """At least one branch matches; ANDed with any sibling fields"""
  OR: [TaskFilters!]

  """Every branch matches"""
  AND: [TaskFilters!]

  """Negates the nested filters"""
  NOT: TaskFilters
}

input StringFilter {
  """Equal to"""
  eq: String

  """Not equal to"""
  ne: String

  """Less than"""
  lt: String

  """Less than or equal to"""
  lte: String

  """Greater than"""
  gt: String

  """Greater than or equal to"""
  gte: String
  like: String
  notLike: String
  ilike: String
  notIlike: String

  """
  Matches values starting with the given string. `%`, `_` and `\` are matched literally.
  """
  startsWith: String

  """
  Matches values ending with the given string. `%`, `_` and `\` are matched literally.
  """
  endsWith: String

  """
  Matches values containing the given string. `%`, `_` and `\` are matched literally.
  """
  contains: String

  """Case-insensitive `startsWith`."""
  iStartsWith: String

