# Tags a release and pushes the image to GHCR and Docker Hub.
#
# The organisation shares DOCKERHUB_USERNAME (the Docker Hub account that owns
# <user>/task-server) and DOCKERHUB_TOKEN (an access token for it, not the
# password) with this repo, so there is nothing to add under Settings → Secrets
# and variables → Actions. ghcr.io needs no secret at all: GITHUB_TOKEN does it.
#
# Versions come from the commit log, so a release only happens when commits say
# what changed — `feat:` for a minor, `fix:` for a patch, `BREAKING CHANGE:` in
# a body for a major. Anything else releases nothing, which is why the manual
# trigger below exists: it publishes the current main under a version you name,
# without waiting for the history to become conventional.
name: Release

on:
  # Never in parallel with the tests: CI has to have passed on this commit.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as, e.g. 0.1.0 (no tag or release notes are created)'
        required: true

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    # A red CI run must not become a published image.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI actually tested, not whatever main has drifted to.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # semantic-release reads the whole log to work out the next version.
          fetch-depth: 0
          # It authenticates with GITHUB_TOKEN itself; the checkout credentials
          # would only shadow that.
          persist-credentials: false

      - name: Semantic release
        id: semantic
        if: github.event_name == 'workflow_run'
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One answer for both triggers, so every step below gates on one thing.
      - name: Decide whether to publish
        id: publish
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "go=${{ steps.semantic.outputs.new_release_published }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.go == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.publish.outputs.go == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.publish.outputs.go == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.publish.outputs.go == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.publish.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/task-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-server:${{ steps.publish.outputs.version }}
          # Shares a cache with the CI build of the same Dockerfile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
