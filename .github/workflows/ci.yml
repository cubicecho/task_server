name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run lint` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      # `npm run build` typechecks too, but a type error and a bundler error
      # deserve to fail on different lines.
      - name: Typecheck
        run: npm run typecheck

      # Vitest against a temp SQLite file per suite; no services needed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The image is only pushed from main, so without this a broken Dockerfile
  # would first be noticed by a release. Builds, does not push.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: task-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs the server's TypeScript through Node's type stripping
      # rather than tsx. That either works or the container dies on boot, and
      # nothing else in CI covers it.
      - name: The container boots and answers
        run: |
          docker run -d --name task-server-ci -p 8787:8787 task-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS -X POST localhost:8787/graphql \
              -H 'content-type: application/json' \
              -d '{"query":"{ tasks { id } }"}' > /dev/null; then
              echo 'server answered'
              exit 0
            fi
            sleep 1
          done
          echo '::error::the container never answered on :8787'
          docker logs task-server-ci
          exit 1

  # Postgres is a second set of table definitions, a second driver and a second
  # pile of DDL, none of which a SQLite boot touches. tests/schema-parity.test.ts
  # keeps the two schemas honest about each other, but only a real database says
  # whether the DDL runs and the rows come back. The compose file is how this is
  # meant to be used, so CI uses that rather than a rig of its own.
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # `--wait` holds until both healthchecks pass, and the server's own is a
      # GraphQL query — so reaching the next step already means postgres
      # answered one.
      - name: Boot the stack
        run: docker compose -f docker-compose.pg.yml up -d --build --wait

      # A write and a read back. A task row carries a boolean, two timestamps
      # and two generated defaults, and a trigger carries JSON — the columns
      # that are stored differently here than in SQLite.
      - name: A task round-trips through postgres
        run: |
          gql() {
            curl -fsS -X POST localhost:8787/graphql \
              -H 'content-type: application/json' -d "{\"query\": $1}"
          }
          gql '"mutation { createTask(values: { name: \"ci\", prompt: \"hi\" }) { id } }"'
          gql '"{ tasks { name enabled createdAt } }"' | tee tasks.json
          grep -q '"name":"ci"' tasks.json
          grep -q '"enabled":true' tasks.json

      - name: Logs, if it did not
        if: failure()
        run: docker compose -f docker-compose.pg.yml logs
