query Settings {
  settings {
    id
    baseUrl
    model
    systemPrompt
    maxTokens
    temperature
    maxToolIterations
  }
  mcpServers(orderBy: { slug: { direction: asc, priority: 1 } }) {
    id
    slug
    label
    enabled
    transport
    command
    args
    env
    url
    headers
  }
  mcpStatus {
    id
    status
    error
    tools {
      name
    }
  }
}

query Models {
  models
}

mutation UpdateSettings($set: UpdateSettingInput!) {
  updateSettingSingle(where: { id: { eq: "default" } }, set: $set) {
    id
  }
}

mutation SetApiKey($apiKey: String!) {
  setApiKey(apiKey: $apiKey)
}

mutation CreateMcpServer($values: CreateMcpServerInput!) {
  createMcpServer(values: $values) {
    id
  }
}

mutation UpdateMcpServer($id: String!, $set: UpdateMcpServerInput!) {
  updateMcpServerSingle(where: { id: { eq: $id } }, set: $set) {
    id
  }
}

mutation DeleteMcpServer($id: String!) {
  deleteMcpServerSingle(where: { id: { eq: $id } }) {
    id
  }
}

mutation ReconnectMcp {
  reconnectMcp {
    id
    status
    error
  }
}
