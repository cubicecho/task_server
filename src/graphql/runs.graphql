query Runs($taskId: String) {
  runs(
    limit: 100
    where: { taskId: { eq: $taskId } }
    orderBy: { startedAt: { direction: desc, priority: 1 } }
  ) {
    id
    taskId
    status
    startedAt
    finishedAt
    output
    error
    toolCalls
    totalTokens
    task {
      name
    }
    steps(orderBy: { position: { direction: asc, priority: 1 } }) {
      id
      position
      depth
      name
      kind
      status
      branch
      output
      error
      toolCalls
      totalTokens
    }
  }
}

mutation DeleteRun($id: String!) {
  deleteRunSingle(where: { id: { eq: $id } }) {
    id
  }
}

subscription RunEvents($runId: String!) {
  runEvents(runId: $runId) {
    seq
    kind
    text
    name
    step
    ok
  }
}
